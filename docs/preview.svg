<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" role="img" aria-label="An artifact timeline panel listing delivered documents with kept, changed and deleted states">
  <defs>
    <linearGradient id="atBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f7fa"/>
      <stop offset="1" stop-color="#e6edf4"/>
    </linearGradient>
    <linearGradient id="atPanel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#fbfdfe"/>
    </linearGradient>
  </defs>

  <!-- Backdrop -->
  <rect x="0" y="0" width="640" height="300" rx="16" fill="url(#atBg)"/>

  <!-- Sidebar strip with the entry highlighted -->
  <rect x="32" y="28" width="86" height="244" rx="12" fill="#dfe8f1"/>
  <rect x="44" y="46" width="62" height="22" rx="6" fill="#c9d8e6"/>
  <rect x="44" y="78" width="62" height="22" rx="6" fill="#7fb2e0" opacity="0.55"/>
  <circle cx="57" cy="89" r="5.5" fill="#2f6fae"/>
  <rect x="68" y="86" width="30" height="6" rx="3" fill="#2f6fae"/>

  <!-- Panel -->
  <rect x="134" y="28" width="474" height="244" rx="12" fill="url(#atPanel)" stroke="#d3dfe9"/>

  <!-- Panel header -->
  <rect x="158" y="50" width="150" height="11" rx="5.5" fill="#33495e"/>
  <rect x="158" y="70" width="216" height="7" rx="3.5" fill="#9db2c6"/>

  <!-- Toolbar chips -->
  <rect x="158" y="90" width="88" height="19" rx="9.5" fill="#eef3f8" stroke="#cfdbe6"/>
  <circle cx="171" cy="99.5" r="4" fill="#3f9d6b"/>
  <rect x="180" y="96.5" width="38" height="6" rx="3" fill="#7c93a8"/>

  <rect x="254" y="90" width="88" height="19" rx="9.5" fill="#eef3f8" stroke="#cfdbe6"/>
  <circle cx="267" cy="99.5" r="4" fill="#d79a24"/>
  <rect x="276" y="96.5" width="38" height="6" rx="3" fill="#7c93a8"/>

  <rect x="350" y="90" width="88" height="19" rx="9.5" fill="#eef3f8" stroke="#cfdbe6"/>
  <circle cx="363" cy="99.5" r="4" fill="#cf4f47"/>
  <rect x="372" y="96.5" width="38" height="6" rx="3" fill="#7c93a8"/>

  <!-- Timeline rows: kept / changed / deleted -->
  <!-- Kept -->
  <rect x="152" y="128" width="438" height="40" rx="8" fill="#f7fafc"/>
  <rect x="152" y="128" width="4" height="40" rx="2" fill="#3f9d6b"/>
  <rect x="166" y="137" width="22" height="22" rx="5" fill="#e4ecf4" stroke="#cfdbe6"/>
  <rect x="199" y="139" width="132" height="8" rx="4" fill="#42586d"/>
  <rect x="199" y="153" width="180" height="6" rx="3" fill="#a8bccd"/>
  <rect x="404" y="140" width="46" height="16" rx="8" fill="none" stroke="#3f9d6b"/>
  <rect x="458" y="140" width="46" height="16" rx="8" fill="none" stroke="#3f9d6b"/>

  <!-- Changed -->
  <rect x="152" y="176" width="438" height="40" rx="8" fill="#fdfaf3"/>
  <rect x="152" y="176" width="4" height="40" rx="2" fill="#d79a24"/>
  <rect x="166" y="185" width="22" height="22" rx="5" fill="#f6efdf" stroke="#e4d3ae"/>
  <rect x="199" y="187" width="112" height="8" rx="4" fill="#42586d"/>
  <rect x="199" y="201" width="164" height="6" rx="3" fill="#a8bccd"/>
  <rect x="404" y="188" width="46" height="16" rx="8" fill="none" stroke="#9db2c6"/>
  <rect x="458" y="188" width="46" height="16" rx="8" fill="none" stroke="#d79a24"/>

  <!-- Deleted -->
  <rect x="152" y="224" width="438" height="40" rx="8" fill="#fdf5f4"/>
  <rect x="152" y="224" width="4" height="40" rx="2" fill="#cf4f47"/>
  <rect x="166" y="233" width="22" height="22" rx="5" fill="#f7e4e2" stroke="#e8c2be"/>
  <rect x="199" y="235" width="126" height="8" rx="4" fill="#8e9dab"/>
  <rect x="199" y="249" width="176" height="6" rx="3" fill="#c3cfda"/>
  <rect x="404" y="236" width="46" height="16" rx="8" fill="none" stroke="#9db2c6"/>
  <rect x="458" y="236" width="46" height="16" rx="8" fill="none" stroke="#cf4f47"/>

  <!-- Strikethrough on the deleted name -->
  <rect x="199" y="238" width="126" height="1.8" rx="0.9" fill="#cf4f47" opacity="0.85"/>
</svg>
